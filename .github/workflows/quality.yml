name: ASPEKT NEXT quality
on:
  push:
    branches: [aspekt-next]
  workflow_dispatch:
concurrency:
  group: aspekt-next-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies['expo-video']!==l.packages[''].dependencies['expo-video'])process.exit(1)"
      - run: node scripts/test-video-staging-gate.mjs
      - run: node scripts/test-native-video-upload.mjs
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install expo export --platform web
        env:
          EXPO_PUBLIC_TRUST_STAGING: 'false'
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-only
      - run: npm audit --audit-level=high
  trust:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: trust_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: trust_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/video_storage_fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128023000_trust_justice.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/trust_justice.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/trust_rls.sql

      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128060000_video_drafts.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/video_drafts.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128063000_video_review.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/video_review.sql

      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128062000_video_engine.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261128065000_video_register_upload.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/video_storage_rls.sql
  media:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate genuine and malformed video files
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:d=1 -an -c:v libx264 -pix_fmt yuv420p /tmp/aspekt-valid.mp4
          node scripts/validate-video.mjs /tmp/aspekt-valid.mp4
          printf 'not a video at all' > /tmp/aspekt-invalid.mp4
          if node scripts/validate-video.mjs /tmp/aspekt-invalid.mp4; then
            echo 'ERROR: Invalid video accepted'
            exit 1
          fi
