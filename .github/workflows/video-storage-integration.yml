name: Isolated Supabase video integration
on:
  workflow_dispatch:
  push:
    branches: [aspekt-next]
    paths:
      - 'scripts/test-video-storage.mjs'
      - 'scripts/process-video-quarantine.mjs'
      - 'scripts/video-worker.mjs'
      - 'supabase/functions/video-playback/**'
      - 'scripts/validate-video.mjs'
      - 'supabase/migrations/*video*.sql'
      - 'src/lib/privateVideo.ts'
      - 'src/lib/videoPlatform.ts'
      - 'src/components/VideoCenter.tsx'
      - 'src/components/PublicVideo*.tsx'
      - 'src/components/PrivateVideo*.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/video-storage-integration.yml'
concurrency:
  group: aspekt-next-video-integration-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  supabase-storage:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: ^2
      - name: Prepare disposable Supabase project (never linked to production)
        run: |
          mkdir -p "$RUNNER_TEMP/aspekt-video-ci"
          cd "$RUNNER_TEMP/aspekt-video-ci"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128023000_trust_justice.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128060000_video_drafts.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128062000_video_engine.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128063000_video_review.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128065000_video_register_upload.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128070000_video_processing_publication.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128072000_video_platform.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128073000_video_platform_publish_gate.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128074000_video_creator_unpublish.sql" supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261128080000_video_beta_catalog.sql" supabase/migrations/
          mkdir -p supabase/functions/video-playback
          cp "$GITHUB_WORKSPACE/supabase/functions/video-playback/index.ts" supabase/functions/video-playback/index.ts
          echo "VIDEO_CI_DIR=$RUNNER_TEMP/aspekt-video-ci" >> "$GITHUB_ENV"
      - name: Start temporary real Supabase Auth and Storage services
        working-directory: ${{ env.VIDEO_CI_DIR }}
        run: |
          supabase start
          supabase status -o env > "$RUNNER_TEMP/aspekt-video-local.env"
      - name: Generate valid media fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=64x64:d=1 -an -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/aspekt-video-fixture.mp4"
      - name: Run actual Supabase API isolation, validation and review tests
        run: |
          set -a
          source "$RUNNER_TEMP/aspekt-video-local.env"
          set +a
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export ASPEKT_VIDEO_FIXTURE="$RUNNER_TEMP/aspekt-video-fixture.mp4"
          echo 'VIDEO_PUBLIC_DELIVERY_ENABLED=true' > "$VIDEO_CI_DIR/video-playback.env"
          (
            cd "$VIDEO_CI_DIR"
            supabase functions serve video-playback --no-verify-jwt --env-file video-playback.env
          ) > "$RUNNER_TEMP/aspekt-edge.log" 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true' EXIT
          export ASPEKT_EDGE_TEST_URL="http://127.0.0.1:54321/functions/v1/video-playback"
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$ASPEKT_EDGE_TEST_URL?id=invalid" || true)
            if [ "$code" = "400" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/aspekt-edge.log"; exit 1; fi
          node scripts/test-video-storage.mjs
      - name: Stop disposable Supabase project
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/aspekt-video-ci/supabase" ]; then
            cd "$RUNNER_TEMP/aspekt-video-ci"
            supabase stop --no-backup || true
          fi
