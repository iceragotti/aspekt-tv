name: Native video dependency check
on:
  workflow_dispatch:
  push:
    branches: [aspekt-next]
    paths: ['.github/workflows/video-native-check.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npx expo install expo-video
      - run: npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-video-dependencies
          path: |
            package.json
            package-lock.json
