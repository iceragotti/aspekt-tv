name: Native video dependency check
on:
  workflow_dispatch:
  push:
    branches: [aspekt-next]
    paths: ['.github/workflows/video-native-check.yml']
permissions:
  contents: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/aspekt-next'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - name: Commit only regenerated lockfile on aspect branch
        if: github.ref == 'refs/heads/aspekt-next'
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies['expo-video']!=='~58.0.14'||l.packages[''].dependencies['expo-video']!==p.dependencies['expo-video'])process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: sync verified expo-video lockfile [skip ci]"
            git push origin HEAD:aspekt-next
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-video-dependencies
          path: |
            package.json
            package-lock.json
